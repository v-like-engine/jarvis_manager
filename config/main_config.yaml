# Gerald Desktop Manager - Main Configuration

# Application Settings
app:
  name: "Gerald Desktop Manager"
  version: "1.0.0"
  character: "gerald"
  default_language: "en"  # en or ru
  auto_start: false       # Launch with Windows
  log_level: "INFO"       # DEBUG, INFO, WARNING, ERROR

# Service Endpoints
services:
  asr:
    host: "localhost"
    port: 8001
    enabled: true

  llm:
    host: "localhost"
    port: 8002
    enabled: true

  command:
    host: "localhost"
    port: 8003
    enabled: true

# Communication
communication:
  type: "http"  # http or messagequeue
  timeout: 30   # seconds

# ASR Service Settings
asr:
  vad:
    threshold: 0.5
    min_speech_duration_ms: 250
    max_speech_duration_s: 30
    padding_duration_ms: 300

  audio:
    sample_rate: 16000
    channels: 1
    chunk_size: 1024

  recognition:
    model_en: "vosk-model-small-en-us-0.15"
    model_ru: "vosk-model-small-ru-0.22"
    confidence_threshold: 0.6

  tts:
    engine: "pyttsx3"  # pyttsx3 or silero
    rate: 180
    volume: 0.9

# LLM Service Settings
llm:
  model: "phi-3-mini"  # phi-3-mini, gemma-2-2b, tinyllama-1.1b
  model_path: "shared/models/llm/"

  inference:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 100
    repetition_penalty: 1.1

  context:
    max_history: 5
    enable_context: true

# Command Service Settings
commands:
  safety:
    confirmation_required:
      - file_delete
      - file_create_in_system
      - terminal_command
      - dir_delete
      - registry_modify

    forbidden_patterns:
      - "format *"
      - "del /s /q C:\\\\"
      - "rm -rf /"
      - "reg delete HKLM"

  apps:
    fuzzy_match_threshold: 70
    cache_apps: true
    cache_ttl: 3600  # seconds

  terminal:
    default_timeout: 30  # seconds
    max_output_size: 10485760  # 10MB
    allowed_shells:
      - "cmd"
      - "powershell"

# Performance Settings
performance:
  max_cpu_percent: 5     # Maximum CPU usage when idle
  max_memory_mb: 4096    # Maximum memory usage
  optimize_for: "cpu"    # cpu or memory

# Privacy Settings
privacy:
  store_user_features: true
  user_db_path: "shared/user_data.db"
  encrypt_data: false

# Logging
logging:
  log_dir: "logs"
  max_size_mb: 100
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
