# Safety rules for command execution

# Commands that can be executed immediately without confirmation
safe_commands:
  - app_launch
  - app_close
  - dir_list
  - dir_navigate
  - music_play
  - music_pause
  - music_next
  - music_previous
  - music_stop
  - volume_up
  - volume_down
  - volume_mute
  - volume_set
  - language_switch
  - language_set
  - get_running_apps
  - get_installed_apps
  # Character switching
  - character_switch
  # System information (all safe - read-only)
  - system_info_computer_name
  - system_info_memory
  - system_info_cpu
  - system_info_disk
  - system_info_os
  - system_info_network
  - system_info_uptime
  - system_info_all
  # Time and date (all safe - read-only or alarm setting)
  - time_get
  - date_get
  - datetime_get
  - weekday_get
  - alarm_set
  - alarm_list
  - alarm_cancel
  - timer_start
  # Calculator (safe - computation only)
  - calculate
  - calculate_add
  - calculate_subtract
  - calculate_multiply
  - calculate_divide
  # Screen control - non-destructive operations
  - screen_lock
  - screen_monitor_off
  - screen_monitor_on
  - screen_cancel_shutdown

# Commands that require user confirmation before execution
confirmation_required:
  - file_delete
  - file_create_in_system
  - dir_delete
  - terminal_command
  - registry_modify
  - startup_modify
  - startup_enable
  - startup_disable
  - process_kill
  # Screen control - potentially disruptive operations
  - screen_sleep
  - screen_shutdown
  - screen_restart
  - screen_hibernate
  - screen_logoff

# Command patterns that should never be executed
forbidden_patterns:
  - "format *"
  - "del /s /q C:\\"
  - "rd /s /q C:\\"
  - "rmdir /s /q C:\\"
  - "rm -rf /"
  - "rm -rf C:\\"
  - "reg delete HKLM"
  - "reg delete HKEY_LOCAL_MACHINE"
  - "deltree"
  # Note: shutdown/restart are allowed through screen_control module with confirmation
  # Direct command-line shutdown without confirmation is forbidden
  - "shutdown /s /f /t 0"  # Immediate forced shutdown
  - "shutdown -s -f -t 0"  # Immediate forced shutdown

# System paths that should be protected from modification
protected_paths:
  - "C:\\Windows"
  - "C:\\Windows\\System32"
  - "C:\\Program Files"
  - "C:\\Program Files (x86)"
  - "C:\\ProgramData"
  - "C:\\System"
  - "C:\\Boot"

# Critical processes that should never be terminated
protected_processes:
  - "csrss.exe"
  - "wininit.exe"
  - "services.exe"
  - "lsass.exe"
  - "winlogon.exe"
  - "smss.exe"
  - "explorer.exe"
  - "System"
  - "Registry"

# Whitelisted terminal commands that don't need confirmation
whitelisted_terminal_commands:
  - "dir"
  - "ls"
  - "cd"
  - "pwd"
  - "echo"
  - "type"
  - "cat"
  - "more"
  - "ping"
  - "ipconfig"
  - "whoami"
  - "hostname"
  - "systeminfo"
  - "tasklist"
  - "netstat"
  - "ver"
  - "date"
  - "time"

# Dangerous command keywords that trigger automatic rejection
dangerous_keywords:
  - "format"
  - "deltree"
  - "cipher /w"
  - "bcdedit"
  - "wmic"
  - "powercfg -h off"
  - "sfc /scannow"
  - "chkdsk"
  - "diskpart"
