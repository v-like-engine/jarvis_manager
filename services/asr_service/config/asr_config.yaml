# ASR Service Configuration

# Service settings
service:
  name: "Gerald ASR Service"
  host: "localhost"
  port: 8001
  debug: false
  workers: 1

# Audio input settings
audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  device_index: null  # null = default device
  buffer_seconds: 0.5

# Voice Activity Detection (VAD)
vad:
  enabled: true
  engine: "silero"  # silero or webrtc
  threshold: 0.5
  min_speech_duration_ms: 250
  max_speech_duration_s: 30
  padding_duration_ms: 300
  frame_duration_ms: 30  # For WebRTC VAD: 10, 20, or 30 ms

# Speech Recognition
asr:
  engine: "vosk"  # vosk or whisper
  languages:
    - "en"
    - "ru"
  default_language: "en"
  confidence_threshold: 0.6
  auto_detect_language: true

  # Model settings
  models:
    en:
      name: "vosk-model-small-en-us-0.15"
      path: "shared/models/asr/vosk-model-small-en-us-0.15"
      download_url: "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
    ru:
      name: "vosk-model-small-ru-0.22"
      path: "shared/models/asr/vosk-model-small-ru-0.22"
      download_url: "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"

# Text-to-Speech
tts:
  engine: "pyttsx3"  # pyttsx3 or silero
  enabled: true

  # pyttsx3 settings
  pyttsx3:
    rate: 180  # Words per minute
    volume: 0.9  # 0.0 to 1.0
    voice_id: null  # null = default, or specific voice ID

  # Active character
  active_character: "gerald"  # Current active character

  # Character voice profiles
  # Each character has unique voice settings for personality expression
  character_profiles:
    gerald:
      name: "Gerald"
      description: "Strict knight, authoritative, commanding"
      english:
        rate: 180        # Words per minute - steady, measured pace
        volume: 0.9      # 0.0 to 1.0 - strong, confident
        pitch: -20       # -50 to 50 - lower, authoritative
        gender: "male"
        voice_id: null   # null = auto-select
      russian:
        rate: 175        # Slightly slower for Russian
        volume: 0.9
        pitch: -20
        gender: "male"
        voice_id: null

    winnie:
      name: "Винни Пух (Winnie the Pooh)"
      description: "Gentle, thoughtful, slow-paced, warm"
      english:
        rate: 140        # Slow, thoughtful
        volume: 0.8      # Softer, gentle
        pitch: -10       # Slightly lower, warm
        gender: "male"
        voice_id: null
      russian:
        rate: 135        # Even slower for thoughtfulness
        volume: 0.8
        pitch: -10
        gender: "male"
        voice_id: null

    rapunzel:
      name: "Rapunzel (Рапунцель)"
      description: "Disney princess, cheerful, curious, energetic"
      english:
        rate: 190        # Energetic, quick
        volume: 0.85     # Bright, clear
        pitch: 15        # Higher, cheerful
        gender: "female"
        voice_id: null
      russian:
        rate: 185        # Slightly slower for Russian
        volume: 0.85
        pitch: 15
        gender: "female"
        voice_id: null

    terminator:
      name: "Терминатор (Terminator)"
      description: "Robotic, direct, monotone, stern, mechanical"
      english:
        rate: 160        # Mechanical, steady
        volume: 1.0      # Loud, commanding
        pitch: -30       # Very deep, robotic
        gender: "male"
        voice_id: null
      russian:
        rate: 160        # Same mechanical pace
        volume: 1.0
        pitch: -30
        gender: "male"
        voice_id: null

# Face Recognition
face_recognition:
  enabled: true
  detection_method: "hog"  # hog or cnn (cnn is more accurate but slower)
  tolerance: 0.6  # Lower = more strict
  num_jitters: 1  # Higher = more accurate but slower
  camera_index: 0  # Webcam index
  capture_timeout: 10  # Seconds to capture face
  min_face_size: 80  # Minimum face size in pixels

# Voice Biometrics (Speaker Identification)
voice_biometrics:
  enabled: false  # Optional feature
  model: "speechbrain/spkrec-ecapa-voxceleb"
  embedding_dim: 192
  similarity_threshold: 0.7
  enrollment_duration: 5  # Seconds of audio for enrollment

# User Database
database:
  path: "shared/user_data.db"
  backup_enabled: true
  backup_interval: 3600  # Seconds

# Performance
performance:
  max_cpu_percent: 5  # Target max CPU when idle
  threading_enabled: true
  async_processing: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/asr_service.log"
  max_size_mb: 50
  backup_count: 3
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Command parsing
commands:
  # Trigger words for various command types
  app_launch:
    en: ["open", "launch", "start", "run"]
    ru: ["открой", "запусти", "открыть", "запустить"]

  app_close:
    en: ["close", "exit", "quit", "stop"]
    ru: ["закрой", "закрыть", "выключи", "останови"]

  recognize_me:
    en: ["recognize me", "who am i", "identify me"]
    ru: ["узнай меня", "кто я", "распознай меня"]

  system:
    en: ["shutdown", "restart", "sleep", "lock"]
    ru: ["выключи", "перезагрузи", "спать", "заблокируй"]

  # Character switching commands
  switch_character:
    en: ["switch to", "change to", "activate", "switch character to", "change character to"]
    ru: ["переключись на", "переключиться на", "смени на", "активируй", "включи режим"]

  # Character name patterns for recognition
  character_names:
    gerald:
      en: ["gerald", "sir gerald", "knight gerald"]
      ru: ["джеральд", "сэр джеральд", "рыцарь джеральд"]
    winnie:
      en: ["winnie", "winnie the pooh", "pooh", "pooh bear"]
      ru: ["винни", "винни пух", "пух", "медвежонок винни"]
    rapunzel:
      en: ["rapunzel", "princess rapunzel"]
      ru: ["рапунцель", "принцесса рапунцель"]
    terminator:
      en: ["terminator", "terminator mode", "robot mode"]
      ru: ["терминатор", "режим терминатора", "режим робота"]
